name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 조사 엑셀 → 개발용 JSON. 커밋된 JSON·도시 판정(status.json)이 엑셀과 다르면 실패한다.
      - name: data:convert
        run: |
          npm run data:convert
          git diff --exit-code -- src/data/generated || {
            echo "::error::src/data/generated 가 data/source/조사자료.xlsx 와 맞지 않습니다. npm run data:convert 결과를 커밋하세요."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (desktop · 375px · 320px)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # 배포하지 않고 Worker 번들·설정만 검증한다(인증 불필요).
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
